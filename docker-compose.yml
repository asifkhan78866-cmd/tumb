services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: neuroseg-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - FRONTEND_ORIGIN=http://localhost:3000
      - MAX_UPLOAD_MB=20
      - METHOD2_MODALITY=SPECT
      - TRAINING_API_ENABLED=false
    # Kaggle/HF credentials are read from a local .env by the BACKEND only.
    # They are never passed to the frontend service.
    env_file:
      - path: .env
        required: false
    volumes:
      # Persist weights, dataset and generated images across restarts.
      - ./backend/weights:/app/backend/weights
      - ./backend/dataset:/app/backend/dataset
      - ./backend/predictions:/app/backend/predictions
      - ./backend/logs:/app/backend/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Build-time: this value is compiled into the browser bundle.
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: neuroseg-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
